<script type="module">

/* =========================================================
   CONFIG
========================================================= */

const DB_NAME = "NEURAL_MEMORY_DB";
const DB_VERSION = 5;
const STORE_NAME = "memories";

const MEMORY_SCHEMA_VERSION = "1.4";

const EMBEDDING_MODEL =
  "Xenova/multilingual-e5-small";

const EMBEDDING_DIMENSION = 384;


/* =========================================================
   STATE
========================================================= */

const state = {

  extractor: null,

  modelLoaded: false,

  processing: false,

  datasets: new Set()

};


/* =========================================================
   LOG
========================================================= */

function log(message){

  const el = document.getElementById("log");

  const time =
    new Date().toLocaleTimeString("de-DE");

  el.textContent +=
    `[${time}] ${message}\n`;

  el.scrollTop = el.scrollHeight;
}


/* =========================================================
   INDEXED DB
========================================================= */

function openDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded = event => {

      const db = event.target.result;

      let store;

      if(!db.objectStoreNames.contains(STORE_NAME)){

        store =
          db.createObjectStore(
            STORE_NAME,
            {keyPath:"id"}
          );

      }else{

        store =
          event.target.transaction.objectStore(
            STORE_NAME
          );

      }

      if(!store.indexNames.contains("dataset_id")){

        store.createIndex(
          "dataset_id",
          "dataset_id",
          {unique:false}
        );

      }

    };

    request.onsuccess =
      () => resolve(request.result);

    request.onerror =
      () => reject(request.error);

  });

}


async function putMemory(record){

  const db = await openDB();

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    tx.objectStore(STORE_NAME)
      .put(record);

    tx.oncomplete =
      () => resolve();

    tx.onerror =
      () => reject(tx.error);

  });

}


async function getAllMemory(){

  const db = await openDB();

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction(
        STORE_NAME,
        "readonly"
      );

    const request =
      tx.objectStore(STORE_NAME).getAll();

    request.onsuccess =
      () => resolve(request.result);

    request.onerror =
      () => reject(request.error);

  });

}


async function clearDatabase(){

  if(!confirm(
    "Wirklich alle gespeicherten Memory Records löschen?"
  )) return;

  const db = await openDB();

  await new Promise((resolve,reject)=>{

    const tx =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    tx.objectStore(STORE_NAME).clear();

    tx.oncomplete =
      () => resolve();

    tx.onerror =
      () => reject(tx.error);

  });

  state.datasets.clear();

  updateStats();

  updateDatasetSelector();

  log("Datenbank gelöscht.");

}


/* =========================================================
   TRANSFORMERS.JS
========================================================= */

async function loadModel(){

  if(state.modelLoaded){

    log("Embedding-Modell bereits geladen.");

    return;

  }

  try{

    document.getElementById("statStatus")
      .textContent = "LOADING";

    log("Transformers.js wird geladen...");

    const module =
      await import(
        "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1"
      );

    const {
      pipeline
    } = module;

    log(
      `Embedding-Modell wird geladen: ${EMBEDDING_MODEL}`
    );

    state.extractor =
      await pipeline(
        "feature-extraction",
        EMBEDDING_MODEL
      );

    state.modelLoaded = true;

    document.getElementById("statModel")
      .textContent = "E5-SMALL";

    document.getElementById("statStatus")
      .textContent = "READY";

    log("Embedding-Modell bereit.");

  }catch(error){

    console.error(error);

    log(
      "FEHLER beim Laden des Embedding-Modells: "
      + error.message
    );

    document.getElementById("statStatus")
      .textContent = "ERROR";

  }

}


/* =========================================================
   EMBEDDING
========================================================= */

async function createEmbedding(text){

  if(!state.modelLoaded){

    await loadModel();

  }

  const result =
    await state.extractor(
      "passage: " + text,
      {
        pooling:"mean",
        normalize:true
      }
    );

  return Array.from(result.data);

}


async function createQueryEmbedding(text){

  if(!state.modelLoaded){

    await loadModel();

  }

  const result =
    await state.extractor(
      "query: " + text,
      {
        pooling:"mean",
        normalize:true
      }
    );

  return Array.from(result.data);

}


/* =========================================================
   HEADER DETECTION
========================================================= */

const KNOWN_HEADERS = [

  "Tag",
  "Datum",
  "Art",
  "Name",
  "Produktklasse",
  "Tarif",
  "Auftragsnummer",
  "BEM",
  "Schalttermin",
  "Basis",
  "Ixus",
  "HW Bonus",
  "Gesamt",
  "Hardware EK",
  "HW Verkauf",
  "Gewinn",
  "Verkäufer",
  "Hardware",
  "To Do",
  "Grund",
  "Summe",

  "ID",
  "VO",
  "Netzbetreiber",
  "Datum Eingabe",
  "Datum Aktivierung",
  "Datum Storno",
  "Vorwahl / Rufnummer",
  "Kunde",
  "Kunden-Nr.",
  "Kunden-Kennwort",
  "Shop",
  "Mitarbeiter",
  "Vorgang",
  "aktueller Tarif",
  "Tarif Freifeld",
  "Tarif-Optionen",
  "Hardware-IMEI",
  "Hardware-Artikelnummer",
  "Shop Provision",
  "Shop Provision bezahlt",
  "Hardware-EK",
  "Zuzahlung / Gutschrift",
  "WKZ",
  "Schaltungsmarge",
  "Mitarbeiter Provision",
  "Mitarbeiter Provision Einheit",
  "Handset-Tipp",
  "NBA",
  "Bemerkung",
  "AU",
  "GU"

];


function normalizeHeader(value){

  return String(value ?? "")
    .trim()
    .toLowerCase();

}


function detectHeaderRow(rows){

  let bestIndex = 0;
  let bestScore = -1;

  const known =
    KNOWN_HEADERS.map(normalizeHeader);

  const limit =
    Math.min(rows.length,30);

  for(let i=0;i<limit;i++){

    const row =
      rows[i] || [];

    let score = 0;

    for(const cell of row){

      const value =
        normalizeHeader(cell);

      if(!value) continue;

      if(known.includes(value)){

        score++;

      }

    }

    if(score > bestScore){

      bestScore = score;
      bestIndex = i;

    }

  }

  return {
    index:bestIndex,
    score:bestScore
  };

}


/* =========================================================
   DATASET IDS
========================================================= */

function slugify(value){

  return String(value ?? "")
    .trim()
    .toUpperCase()
    .replace(/\s+/g,"-")
    .replace(/[^A-Z0-9ÄÖÜß_-]/g,"");

}


function createDatasetId(fileName,sheetName){

  return (
    slugify(
      fileName
        .replace(/\.[^.]+$/,"")
    )
    + "__"
    + slugify(sheetName)
  );

}


function createMemoryId(
  datasetId,
  excelRow
){

  return (
    datasetId
    + "__ROW-"
    + String(excelRow)
        .padStart(6,"0")
  );

}


/* =========================================================
   VALUE TYPES
========================================================= */

function detectValueType(value){

  if(value === null ||
     value === undefined ||
     value === ""){

    return "null";

  }

  if(typeof value === "number"){

    return "number";

  }

  if(typeof value === "boolean"){

    return "boolean";

  }

  return "string";

}


/* =========================================================
   MEMORY REPRESENTATION
========================================================= */

/*
   WICHTIG:

   Diese Funktion erzeugt die Memory-Darstellung.

   Sie wird NICHT in IndexedDB gespeichert.

   Gespeichert werden nur:
   - RAW DATA
   - EMBEDDING
   - Metadaten
*/

function createMemoryRepresentation(record){

  const fields = [];

  for(const [name,value]
       of Object.entries(record.data || {})){

    fields.push({

      name,

      value,

      value_type:
        detectValueType(value)

    });

  }

  return {

    representation_version:
      MEMORY_SCHEMA_VERSION,

    type:
      "tabular-row",

    identity:{

      memory_id:
        record.memory_id,

      dataset_id:
        record.dataset_id

    },

    provenance:{

      file:
        record.source.file,

      sheet:
        record.source.sheet,

      row:
        record.source.row

    },

    fields

  };

}


/* =========================================================
   EMBEDDING TEXT
========================================================= */

function createEmbeddingText(record){

  const memory =
    createMemoryRepresentation(record);

  const lines = [];

  lines.push(
    `Dataset: ${memory.identity.dataset_id}`
  );

  lines.push(
    `Datei: ${memory.provenance.file}`
  );

  lines.push(
    `Sheet: ${memory.provenance.sheet}`
  );

  lines.push(
    `Zeile: ${memory.provenance.row}`
  );

  for(const field of memory.fields){

    if(
      field.value === null ||
      field.value === undefined ||
      field.value === ""
    ){

      continue;

    }

    lines.push(
      `${field.name}: ${field.value}`
    );

  }

  return lines.join(". ");

}


/* =========================================================
   RECORD BUILD
========================================================= */

async function buildMemoryRecord(
  datasetId,
  fileName,
  sheetName,
  excelRow,
  row
){

  const memoryId =
    createMemoryId(
      datasetId,
      excelRow
    );

  /*
     Temporärer Record für die Erstellung
     der Memory Representation.

     Diese Representation wird danach NICHT
     im gespeicherten Record abgelegt.
  */

  const temporaryRecord = {

    memory_id:
      memoryId,

    dataset_id:
      datasetId,

    source:{

      file:
        fileName,

      sheet:
        sheetName,

      row:
        excelRow

    },

    data:
      row

  };


  const embeddingText =
    createEmbeddingText(
      temporaryRecord
    );


  const embedding =
    await createEmbedding(
      embeddingText
    );


  /*
     DAS ist der tatsächlich gespeicherte Record.

     Kein "memory" Feld.
  */

  return {

    id:
      memoryId,

    memory_id:
      memoryId,

    dataset_id:
      datasetId,

    memory_schema_version:
      MEMORY_SCHEMA_VERSION,

    source:{

      file:
        fileName,

      sheet:
        sheetName,

      row:
        excelRow

    },

    data:
      row,

    embedding_text:
      embeddingText,

    embedding,

    dimension:
      embedding.length,

    model:
      EMBEDDING_MODEL,

    created:
      new Date().toISOString()

  };

}


/* =========================================================
   COMPATIBILITY
========================================================= */

function isCompatibleMemoryRecord(
  record
){

  return (

    record &&
    record.memory_schema_version ===
      MEMORY_SCHEMA_VERSION &&

    record.dataset_id &&

    record.source &&

    Number(record.dimension) ===
      EMBEDDING_DIMENSION &&

    record.model ===
      EMBEDDING_MODEL &&

    Array.isArray(record.embedding) &&

    record.embedding.length ===
      EMBEDDING_DIMENSION &&

    record.data

  );

}


/* =========================================================
   FILE PROCESSING
========================================================= */

async function processFiles(){

  if(state.processing){

    return;

  }

  const files =
    document.getElementById(
      "fileInput"
    ).files;

  if(!files.length){

    alert("Bitte Excel-Dateien auswählen.");

    return;

  }

  state.processing = true;

  document.getElementById("statStatus")
    .textContent = "PROCESSING";

  try{

    await loadModel();

    const existing =
      await getAllMemory();

    const existingMap =
      new Map(
        existing.map(
          record => [record.id,record]
        )
      );


    for(const file of files){

      await processFile(
        file,
        existingMap
      );

    }


    await updateStats();

    updateDatasetSelector();

    document.getElementById("statStatus")
      .textContent = "READY";

  }catch(error){

    console.error(error);

    log(
      "FEHLER: "
      + error.message
    );

    document.getElementById("statStatus")
      .textContent = "ERROR";

  }finally{

    state.processing = false;

  }

}


/* =========================================================
   ONE FILE
========================================================= */

async function processFile(
  file,
  existingMap
){

  log(
    `Datei wird gelesen: ${file.name}`
  );

  const buffer =
    await file.arrayBuffer();

  const workbook =
    XLSX.read(
      buffer,
      {
        type:"array",
        cellDates:true
      }
    );


  log(
    `${workbook.SheetNames.length} Worksheet(s) erkannt.`
  );


  let totalCandidates = 0;


  for(const sheetName of workbook.SheetNames){

    const sheet =
      workbook.Sheets[sheetName];

    const rows =
      XLSX.utils.sheet_to_json(
        sheet,
        {
          header:1,
          defval:null,
          raw:true
        }
      );


    if(!rows.length){

      continue;

    }


    const headerInfo =
      detectHeaderRow(rows);

    const headerIndex =
      headerInfo.index;


    const headerRow =
      rows[headerIndex] || [];


    const headers =
      headerRow.map(
        (value,index)=>{

          const text =
            String(
              value ?? ""
            ).trim();

          return text ||
            `COLUMN_${index + 1}`;

        }
      );


    const dataRows =
      rows.slice(
        headerIndex + 1
      );


    const datasetId =
      createDatasetId(
        file.name,
        sheetName
      );


    log(
      `Worksheet "${sheetName}" | Header Zeile ${headerIndex + 1} | ${dataRows.length} Datenzeilen.`
    );


    let rowNumber =
      headerIndex + 2;


    for(const rawRow of dataRows){

      const row = {};

      let hasValue = false;


      headers.forEach(
        (header,index)=>{

          const value =
            rawRow[index] ?? null;

          row[header] =
            value;

          if(
            value !== null &&
            value !== ""
          ){

            hasValue = true;

          }

        }
      );


      if(!hasValue){

        rowNumber++;

        continue;

      }


      totalCandidates++;


      const memoryId =
        createMemoryId(
          datasetId,
          rowNumber
        );


      const oldRecord =
        existingMap.get(
          memoryId
        );


      /*
         Bereits kompatibler Record:
         nichts neu berechnen.
      */

      if(
        oldRecord &&
        isCompatibleMemoryRecord(
          oldRecord
        )
      ){

        state.datasets.add(
          datasetId
        );

        rowNumber++;

        continue;

      }


      /*
         Neuer oder inkompatibler Record.
      */

      const record =
        await buildMemoryRecord(
          datasetId,
          file.name,
          sheetName,
          rowNumber,
          row
        );


      await putMemory(record);


      state.datasets.add(
        datasetId
      );


      if(
        totalCandidates % 25 === 0
      ){

        log(
          `${totalCandidates} Memory-Kandidaten verarbeitet...`
        );

      }


      rowNumber++;

    }

  }


  log(
    `FILE DATASET verarbeitet: ${file.name}`
  );

  log(
    `Gesamt: ${totalCandidates} Memory-Kandidaten`
  );

}


/* =========================================================
   COSINE SIMILARITY
========================================================= */

function cosineSimilarity(a,b){

  if(
    !Array.isArray(a) ||
    !Array.isArray(b) ||
    a.length !== b.length
  ){

    return -1;

  }

  let dot = 0;
  let normA = 0;
  let normB = 0;


  for(let i=0;i<a.length;i++){

    dot +=
      a[i] * b[i];

    normA +=
      a[i] * a[i];

    normB +=
      b[i] * b[i];

  }


  if(
    normA === 0 ||
    normB === 0
  ){

    return 0;

  }


  return (
    dot /
    (
      Math.sqrt(normA) *
      Math.sqrt(normB)
    )
  );

}


/* =========================================================
   RETRIEVAL
========================================================= */

async function searchMemory(
  question,
  topK = 5,
  datasetId = null
){

  const queryEmbedding =
    await createQueryEmbedding(
      question
    );


  const records =
    await getAllMemory();


  const candidates =
    records.filter(
      record => {

        if(
          !isCompatibleMemoryRecord(
            record
          )
        ){

          return false;

        }

        if(
          datasetId &&
          record.dataset_id !== datasetId
        ){

          return false;

        }

        return true;

      }
    );


  const ranked =
    candidates.map(
      record => ({

        record,

        score:
          cosineSimilarity(
            queryEmbedding,
            record.embedding
          )

      })
    );


  ranked.sort(
    (a,b)=>
      b.score - a.score
  );


  return ranked.slice(
    0,
    topK
  );

}


/* =========================================================
   DISPLAY MEMORY
========================================================= */

/*
   HIER entsteht das Gedächtnis nur zur Anzeige.

   Es wird aus RAW DATA rekonstruiert.

   Es wurde nicht aus IndexedDB geladen.
*/

function formatMemoryForDisplay(record){

  const memory =
    createMemoryRepresentation(
      record
    );


  const lines = [];

  lines.push(
    "MEMORY REPRESENTATION"
  );

  lines.push(
    `memory_id: ${memory.identity.memory_id}`
  );

  lines.push(
    `dataset_id: ${memory.identity.dataset_id}`
  );

  lines.push(
    `source: ${memory.provenance.file}`
  );

  lines.push(
    `sheet: ${memory.provenance.sheet}`
  );

  lines.push(
    `row: ${memory.provenance.row}`
  );

  lines.push("");

  for(const field of memory.fields){

    lines.push(
      `${field.name}: ${field.value}`
    );

  }

  return lines.join("\n");

}


/* =========================================================
   SEARCH UI
========================================================= */

async function runSearch(){

  const question =
    document.getElementById(
      "queryInput"
    ).value.trim();


  if(!question){

    alert(
      "Bitte eine Anfrage eingeben."
    );

    return;

  }


  const topK =
    Number(
      document.getElementById(
        "topK"
      ).value
    );


  const datasetId =
    document.getElementById(
      "datasetFilter"
    ).value;


  const resultsEl =
    document.getElementById(
      "results"
    );


  resultsEl.innerHTML =
    "<div class='meta'>Embedding + Retrieval läuft...</div>";


  try{

    const results =
      await searchMemory(
        question,
        topK,
        datasetId || null
      );


    resultsEl.innerHTML = "";


    if(!results.length){

      resultsEl.innerHTML =
        "<div class='meta'>Keine Treffer.</div>";

      return;

    }


    for(
      let i=0;
      i<results.length;
      i++
    ){

      const item =
        results[i];

      const record =
        item.record;


      const result =
        document.createElement(
          "div"
        );

      result.className =
        "result";


      const header =
        document.createElement(
          "div"
        );

      header.className =
        "resultHeader";


      header.innerHTML = `
        <div>
          <strong>#${i + 1}</strong>
          <div class="meta">
            ${escapeHtml(record.memory_id)}
          </div>
        </div>

        <div class="score">
          ${item.score.toFixed(5)}
        </div>
      `;


      const meta =
        document.createElement(
          "div"
        );

      meta.className =
        "meta";


      meta.textContent =
        `${record.source.file} · ` +
        `${record.source.sheet} · ` +
        `Excel-Zeile ${record.source.row}`;


      const memory =
        document.createElement(
          "div"
        );

      memory.className =
        "memory";


      memory.textContent =
        formatMemoryForDisplay(
          record
        );


      const raw =
        document.createElement(
          "details"
        );


      raw.innerHTML = `
        <summary style="margin-top:12px;cursor:pointer">
          RAW DATA anzeigen
        </summary>
        <pre>${escapeHtml(
          JSON.stringify(
            record.data,
            null,
            2
          )
        )}</pre>
      `;


      result.appendChild(header);

      result.appendChild(meta);

      result.appendChild(memory);

      result.appendChild(raw);

      resultsEl.appendChild(result);

    }


  }catch(error){

    console.error(error);

    resultsEl.innerHTML =
      `<div class="meta">
        Retrieval-Fehler:
        ${escapeHtml(error.message)}
      </div>`;

  }

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   DATASET SELECTOR
========================================================= */

async function updateDatasetSelector(){

  const records =
    await getAllMemory();


  const datasets =
    new Set(
      records
        .filter(
          r =>
            r &&
            r.dataset_id
        )
        .map(
          r =>
            r.dataset_id
        )
    );


  state.datasets =
    datasets;


  const select =
    document.getElementById(
      "datasetFilter"
    );


  const current =
    select.value;


  select.innerHTML =
    `<option value="">
      ALLE DATASETS
    </option>`;


  Array.from(datasets)
    .sort()
    .forEach(
      dataset => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          dataset;

        option.textContent =
          dataset;

        select.appendChild(
          option
        );

      }
    );


  if(
    Array.from(datasets)
      .includes(current)
  ){

    select.value =
      current;

  }

}
