<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#020308">

<title>NEURAL MEMORY — Semantic Retrieval Lab</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#020308;
  --panel:#060914;
  --panel2:#09101d;

  --cyan:#00f5ff;
  --cyan2:#00aaff;
  --pink:#ff00aa;
  --green:#4aff88;
  --yellow:#ffe600;
  --red:#ff3355;

  --text:#d9faff;
  --muted:#62818c;

  --line:rgba(0,245,255,.22);

  --glow:
    0 0 12px rgba(0,245,255,.55),
    0 0 35px rgba(0,245,255,.18);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    "Liberation Mono",
    monospace;
}

body{
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  position:sticky;
  top:0;
  z-index:50;

  height:72px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 22px;

  background:
    linear-gradient(
      180deg,
      rgba(2,3,8,.98),
      rgba(2,3,8,.92)
    );

  border-bottom:1px solid var(--line);

  box-shadow:
    0 4px 30px rgba(0,0,0,.45);
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:42px;
  height:42px;

  display:grid;
  place-items:center;

  border:1px solid var(--cyan);
  color:var(--cyan);

  box-shadow:var(--glow);

  font-size:23px;
  font-weight:900;
}

.title{
  font-size:20px;
  font-weight:900;
  letter-spacing:.16em;
}

.subtitle{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.18em;
}

.system-status{
  display:flex;
  align-items:center;
  gap:9px;

  color:var(--green);

  font-size:10px;
  letter-spacing:.15em;
}

.status-dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 7px var(--green),
    0 0 18px rgba(74,255,136,.5);
}

/* =========================================================
   MAIN
========================================================= */

.main{
  flex:1;

  display:grid;

  grid-template-columns:
    minmax(240px, .8fr)
    minmax(420px, 1.5fr)
    minmax(280px, .9fr);

  gap:12px;

  padding:12px;
}

.column{
  min-width:0;

  display:flex;
  flex-direction:column;

  gap:12px;
}

/* =========================================================
   PANEL
========================================================= */

.panel{
  background:
    linear-gradient(
      145deg,
      rgba(6,9,20,.98),
      rgba(4,7,15,.98)
    );

  border:1px solid var(--line);

  box-shadow:
    inset 0 0 30px rgba(0,245,255,.018),
    0 8px 30px rgba(0,0,0,.28);
}

.panel-head{
  min-height:42px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:9px 12px;

  border-bottom:1px solid rgba(0,245,255,.14);

  background:rgba(0,245,255,.025);
}

.panel-title{
  color:var(--cyan);

  font-size:11px;
  font-weight:900;

  letter-spacing:.14em;
}

.panel-subtitle{
  color:var(--muted);
  font-size:9px;
}

.panel-body{
  padding:12px;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
  min-height:38px;

  padding:8px 12px;

  border:1px solid rgba(0,245,255,.35);

  background:#07101a;

  color:var(--cyan);

  transition:
    background .15s,
    border-color .15s,
    transform .1s,
    box-shadow .15s;
}

.btn:hover{
  background:#0b1925;

  border-color:var(--cyan);

  box-shadow:var(--glow);
}

.btn:active{
  transform:translateY(1px);
}

.btn.primary{
  border-color:var(--cyan);
  background:rgba(0,245,255,.08);
}

.btn.green{
  color:var(--green);
  border-color:rgba(74,255,136,.4);
}

.btn.green:hover{
  border-color:var(--green);
}

.btn.pink{
  color:var(--pink);
  border-color:rgba(255,0,170,.4);
}

.btn.danger{
  color:var(--red);
  border-color:rgba(255,51,85,.4);
}

.btn.full{
  width:100%;
}

/* =========================================================
   DROPZONE
========================================================= */

.dropzone{
  min-height:160px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:20px;

  border:1px dashed rgba(0,245,255,.45);

  background:
    radial-gradient(
      circle at center,
      rgba(0,245,255,.055),
      transparent 65%
    );

  transition:.15s;
}

.dropzone.dragover{
  border-color:var(--green);

  background:
    radial-gradient(
      circle at center,
      rgba(74,255,136,.10),
      transparent 65%
    );

  box-shadow:
    0 0 25px rgba(74,255,136,.15);
}

.drop-icon{
  font-size:34px;
  color:var(--cyan);
  margin-bottom:10px;
}

.drop-title{
  color:var(--text);
  font-size:13px;
  font-weight:900;
}

.drop-text{
  margin-top:7px;
  color:var(--muted);
  font-size:9px;
  line-height:1.5;
}

.file-input{
  display:none;
}

/* =========================================================
   FILE INFO
========================================================= */

.file-info{
  margin-top:10px;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:6px;
}

.info-box{
  padding:8px;

  border:1px solid rgba(0,245,255,.12);

  background:#040812;
}

.info-label{
  color:var(--muted);
  font-size:8px;
  letter-spacing:.12em;
}

.info-value{
  margin-top:4px;

  color:var(--text);

  font-size:10px;

  word-break:break-word;
}

/* =========================================================
   SHEETS
========================================================= */

.sheet-list{
  display:flex;
  flex-direction:column;

  gap:5px;

  max-height:260px;

  overflow:auto;
}

.sheet{
  width:100%;

  padding:9px 10px;

  display:flex;
  justify-content:space-between;

  border:1px solid rgba(0,245,255,.12);

  background:#040812;

  color:var(--text);

  text-align:left;

  font-size:10px;
}

.sheet:hover{
  border-color:rgba(0,245,255,.4);
}

.sheet.active{
  border-color:var(--cyan);

  color:var(--cyan);

  background:rgba(0,245,255,.055);

  box-shadow:
    inset 3px 0 0 var(--cyan);
}

.sheet-count{
  color:var(--muted);
}

/* =========================================================
   TABLE
========================================================= */

.table-wrap{
  width:100%;

  overflow:auto;

  max-height:460px;

  border:1px solid rgba(0,245,255,.12);
}

table{
  width:100%;

  border-collapse:collapse;

  font-size:9px;

  white-space:nowrap;
}

th,
td{
  padding:7px 8px;

  border-right:1px solid rgba(0,245,255,.07);
  border-bottom:1px solid rgba(0,245,255,.07);

  text-align:left;

  max-width:260px;

  overflow:hidden;

  text-overflow:ellipsis;
}
