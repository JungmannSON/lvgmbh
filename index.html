<script type="module">

/* =========================================================
   NEURAL MEMORY
   REAL EMBEDDING CORE
   Xenova/multilingual-e5-small
   ========================================================= */

const MODEL = "Xenova/multilingual-e5-small";
const EMBEDDING_DIM = 384;

let extractor = null;


/* =========================================================
   1. EMBEDDING-MODELL LADEN
   ========================================================= */

async function loadEmbeddingModel() {

  if (extractor) {
    return extractor;
  }

  console.log("Embedding-Modell wird geladen:", MODEL);

  const transformers = await import(
    "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1"
  );

  extractor = await transformers.pipeline(
    "feature-extraction",
    MODEL
  );

  console.log("Embedding-Modell bereit.");

  return extractor;
}


/* =========================================================
   2. TEXT → EMBEDDING
   ========================================================= */

async function createEmbedding(text) {

  const model = await loadEmbeddingModel();

  /*
   * E5 erwartet für gespeicherte Dokumente:
   *
   * passage: <text>
   */

  const prepared = `passage: ${String(text).trim()}`;

  const output = await model(prepared, {
    pooling: "mean",
    normalize: true
  });

  const vector = Array.from(output.data);

  if (vector.length !== EMBEDDING_DIM) {
    throw new Error(
      `Falsche Embedding-Dimension: ${vector.length}. ` +
      `Erwartet: ${EMBEDDING_DIM}`
    );
  }

  return vector;
}


/* =========================================================
   3. EXCEL-RECORD → DETERMINISTISCHER TEXT
   ========================================================= */

function createEmbeddingText(record) {

  const lines = [];

  lines.push(
    `SOURCE FILE: ${record.source.file}`
  );

  lines.push(
    `SHEET: ${record.source.sheet}`
  );

  lines.push(
    `ROW: ${record.source.row}`
  );

  for (const [field, value] of Object.entries(record.data)) {

    let normalizedValue;

    if (value === null || value === undefined) {
      normalizedValue = "null";
    }

    else if (typeof value === "object") {
      normalizedValue = JSON.stringify(value);
    }

    else {
      normalizedValue = String(value);
    }

    lines.push(
      `FIELD "${field}": ${normalizedValue}`
    );
  }

  return lines.join("\n");
}


/* =========================================================
   4. RECORD → MEMORY RECORD
   ========================================================= */

async function buildMemoryRecord(record) {

  /*
   * Originaldaten bleiben unverändert.
   */

  const embeddingText =
    createEmbeddingText(record);

  /*
   * Jetzt passiert der eigentliche
   * semantische Vektor-Schritt.
   */

  const embedding =
    await createEmbedding(embeddingText);

  return {

    id: record.memory_id,

    memory_id: record.memory_id,

    source: {
      file: record.source.file,
      sheet: record.source.sheet,
      row: record.source.row
    },

    /*
     * RAW DATA
     *
     * unverändert
     */

    data: record.data,

    /*
     * DETERMINISTIC TEXT
     *
     * reproduzierbare Eingabe
     * für das Embedding-Modell
     */

    embedding_text: embeddingText,

    /*
     * REAL 384D VECTOR
     */

    embedding: embedding,

    dimension: embedding.length,

    model: MODEL,

    created: new Date().toISOString()
  };
}

/* =========================================================
   6. COSINE SIMILARITY
   ========================================================= */

function cosineSimilarity(a, b) {

  if (a.length !== b.length) {
    throw new Error(
      "Vektoren haben unterschiedliche Dimensionen."
    );
  }

  let dot = 0;

  let normA = 0;

  let normB = 0;


  for (let i = 0; i < a.length; i++) {

    dot += a[i] * b[i];

    normA += a[i] * a[i];

    normB += b[i] * b[i];

  }


  if (normA === 0 || normB === 0) {
    return 0;
  }


  return (
    dot /
    (
      Math.sqrt(normA) *
      Math.sqrt(normB)
    )
  );
}


/* =========================================================
   7. QUERY-EMBEDDING
   ========================================================= */

async function createQueryEmbedding(question) {

  const model = await loadEmbeddingModel();

  /*
   * E5:
   *
   * query: <suchanfrage>
   */

  const prepared =
    `query: ${String(question).trim()}`;


  const output =
    await model(prepared, {
      pooling: "mean",
      normalize: true
    });


  const vector =
    Array.from(output.data);


  if (vector.length !== EMBEDDING_DIM) {

    throw new Error(
      `Falsche Query-Dimension: ${vector.length}`
    );

  }


  return vector;
}


/* =========================================================
   8. MEMORY RETRIEVAL
   ========================================================= */

async function searchMemory(
  question,
  memoryRecords,
  topK = 5
) {

  /*
   * Benutzerfrage
   * ↓
   * 384D Query-Vektor
   */

  const queryVector =
    await createQueryEmbedding(question);


  /*
   * Jeden gespeicherten
   * 384D Vektor vergleichen.
   */

  const scored =
    memoryRecords.map(record => {

      const similarity =
        cosineSimilarity(
          queryVector,
          record.embedding
        );


      return {

        record,

        similarity

      };

    });


  /*
   * Höchste Ähnlichkeit zuerst.
   */

  scored.sort(
    (a, b) =>
      b.similarity - a.similarity
  );


  return scored.slice(
    0,
    topK
  );
}

}
