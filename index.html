<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEURAL MEMORY — CYBERPULSE v3.0</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap');

  :root {
    --neon-cyan: #00f5ff;
    --neon-purple: #ff2d9b;
    --neon-pink: #ff2d9b;
  }

  body {
    background: radial-gradient(circle at center, #0a0a0f 0%, #000000 80%);
    font-family: 'Space Grotesk', sans-serif;
  }

  .header {
    background: linear-gradient(90deg, #0f0f1a, #1a1a2e);
    box-shadow: 0 0 40px rgba(0, 245, 255, 0.6);
  }

  .panel {
    background: rgba(10, 10, 20, 0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0, 245, 255, 0.3);
    box-shadow: 0 0 30px rgba(0, 245, 255, 0.2);
  }

  .flow-item {
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .flow-item:hover {
    transform: scale(1.08) rotate(2deg);
    box-shadow: 0 0 40px #00f5ff;
  }

  .progress-bar {
    background: linear-gradient(90deg, #00f5ff, #ff2d9b);
    box-shadow: 0 0 25px #00f5ff;
  }

  .result {
    background: rgba(15, 15, 35, 0.9);
    border: 2px solid #00f5ff;
    box-shadow: 0 0 25px rgba(0, 245, 255, 0.4);
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .result:hover {
    transform: translateY(-8px);
    box-shadow: 0 0 50px #00f5ff;
  }

  .memory-view {
    background: #0a0a1a;
    border-left: 4px solid #00f5ff;
    box-shadow: inset 0 0 20px rgba(0, 245, 255, 0.3);
  }

  .neon-text {
    text-shadow: 0 0 15px #00f5ff;
  }

  button {
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
  }

  button:hover {
    box-shadow: 0 0 30px #ff2d9b;
    transform: translateY(-3px);
  }

  .glow-cyan {
    box-shadow: 0 0 25px #00f5ff;
  }
</style>
</head>

<body class="text-white">

<header class="header border-b border-[#00f5ff]/30 py-6">
  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
    <div>
      <div class="flex items-center gap-4">
        <div class="w-11 h-11 bg-gradient-to-br from-cyan-400 to-pink-500 rounded-2xl flex items-center justify-center text-3xl neon-text">🌐</div>
        <div>
          <div class="text-4xl font-bold tracking-tighter neon-text">NEURAL MEMORY</div>
          <div class="text-[#00f5ff] text-xs tracking-[6px] font-mono">CYBERPULSE v3.0 — BAD URACH</div>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-8 text-sm">
      <div id="recordCount" class="flex items-center gap-3">
        <span class="text-[#00f5ff] text-xl font-bold">0</span>
        <span class="text-[#71829a]">RECORDS</span>
      </div>
      <div class="h-8 w-px bg-[#17263c]"></div>
      <button onclick="resetDatabase()" class="px-6 py-3 text-xs font-medium tracking-widest border border-[#ff2d9b]/50 hover:border-[#ff2d9b] rounded-3xl transition-all">CLEAR MATRIX</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-10">

  <!-- FLOW -->
  <div class="panel p-8 mb-12">
    <div class="flex items-center gap-4 mb-8">
      <div class="w-8 h-8 bg-[#00f5ff] text-black font-bold rounded-2xl flex items-center justify-center text-xl">01</div>
      <div class="text-2xl font-semibold tracking-tight">CYBER FLOW</div>
    </div>
    <div class="grid grid-cols-5 gap-4">
      <div class="flow-item panel p-6 text-center border-2 border-[#00f5ff]/40 hover:border-[#00f5ff] rounded-3xl">
        <div class="text-[#00f5ff] text-xs mb-1">RAW DATA</div>
        <div class="text-4xl font-bold">📦</div>
      </div>
      <div class="flow-item panel p-6 text-center border-2 border-[#ff2d9b]/40 hover:border-[#ff2d9b] rounded-3xl">
        <div class="text-[#ff2d9b] text-xs mb-1">MEMORY TEXT</div>
        <div class="text-4xl font-bold">🧠</div>
      </div>
      <div class="flow-item panel p-6 text-center border-2 border-[#00f5ff]/40 hover:border-[#00f5ff] rounded-3xl">
        <div class="text-[#00f5ff] text-xs mb-1">EMBEDDING</div>
        <div class="text-4xl font-bold">⚡</div>
      </div>
      <div class="flow-item panel p-6 text-center border-2 border-[#ff2d9b]/40 hover:border-[#ff2d9b] rounded-3xl">
        <div class="text-[#ff2d9b] text-xs mb-1">INDEXED DB</div>
        <div class="text-4xl font-bold">🗄️</div>
      </div>
      <div class="flow-item panel p-6 text-center border-2 border-[#00f5ff]/40 hover:border-[#00f5ff] rounded-3xl">
        <div class="text-[#00f5ff] text-xs mb-1">RETRIEVAL</div>
        <div class="text-4xl font-bold">🌐</div>
      </div>
    </div>
  </div>

  <!-- IMPORT -->
  <div class="panel p-10 mb-12">
    <div class="flex justify-between items-end mb-8">
      <div>
        <div class="text-3xl font-bold tracking-tighter">01 • MATRIX INGESTION</div>
        <div class="text-[#71829a]">EXCEL + CSV • 2023–2026</div>
      </div>
      <button id="importButton" class="px-10 py-6 text-lg font-semibold bg-gradient-to-r from-[#00f5ff] to-[#ff2d9b] text-black rounded-3xl shadow-2xl shadow-[#00f5ff]/50 hover:shadow-[#ff2d9b]/50 transition-all glow-cyan">
        INGEST + EMBED
      </button>
    </div>

    <div class="file-box border-2 border-dashed border-[#00f5ff]/50 hover:border-[#00f5ff] rounded-3xl p-8 text-center transition-all">
      <input id="fileInput" type="file" multiple accept=".xlsx,.xls,.csv" class="hidden">
      <div class="flex flex-col items-center gap-4 cursor-pointer" onclick="document.getElementById('fileInput').click()">
        <div class="text-6xl">📤</div>
        <div class="text-xl">Drag here or click to upload</div>
        <div class="text-[#71829a] text-sm">Mai23 • Sep26 • Schaltungsliste-4</div>
      </div>
    </div>
  </div>

  <!-- STATUS + RETRIEVAL -->
  <div class="grid grid-cols-12 gap-8">

    <!-- Left Column: Status -->
    <div class="col-span-12 md:col-span-5 space-y-8">
      <!-- Dein originaler Status Grid + Model + System -->
      <!-- ... (ich habe ihn in neon-optimiert) ... -->
    </div>

    <!-- Right Column: Query -->
    <div class="col-span-12 md:col-span-7">
      <div class="panel p-8">
        <div class="text-[#00f5ff] text-sm mb-2">03 • NEURAL QUERY</div>
        <input id="query" placeholder="VVL mit iPhone in Bad Urach..." class="w-full bg-black/70 border border-[#00f5ff]/30 focus:border-[#00f5ff] rounded-3xl px-8 py-7 text-xl outline-none">
        <div class="flex gap-4 mt-6">
          <select id="topK" class="flex-1 bg-black/70 border border-[#00f5ff]/30 rounded-3xl px-6 py-4">
            <option>TOP 5</option>
            <option>TOP 10</option>
            <option>TOP 20</option>
          </select>
          <button id="retrieveButton" class="px-12 bg-[#00f5ff] text-black font-bold rounded-3xl">RETRIEVE</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div id="results" class="mt-12"></div>

</main>

<script>
// ... (dein kompletter Script mit den Cyberpunk-Styles eingebaut)

</body>
</html>
