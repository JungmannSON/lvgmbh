<style>
/* ROOT & RESET (wie bei dir) */

.relation{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #101a28;font-size:8px}

.inspector-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}

footer{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-top:1px solid var(--line);color:#506175;font-size:8px;letter-spacing:.1em}
#log{color:var(--green)}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%)translateY(20px);opacity:0;pointer-events:none;z-index:100;border:1px solid var(--cyan);background:#050914;color:var(--text);padding:10px 14px;font-size:9px;letter-spacing:.08em;transition:.2s;box-shadow:0 0 25px rgba(0,245,255,.12)}
.toast.show{opacity:1;transform:translateX(-50%)translateY(0)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
.modal-backdrop.show{display:flex}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line);background:#060a12;box-shadow:0 0 50px rgba(0,245,255,.12)}
.modal-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-title{color:var(--cyan);font-size:10px;letter-spacing:.16em;font-weight:800}
.modal-body{padding:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}
@media(max-width:1000px){
  #app{grid-template-columns:260px 1fr}
  .right{display:none}
  header,footer{grid-column:1/3}
}
@media(max-width:700px){
  body{overflow:auto}
  #app{height:auto;min-height:100%;display:block}
  header{height:60px}
  .left,.right{border:none;border-bottom:1px solid var(--line)}
  .space{height:65vh;min-height:450px}
  footer{height:34px}
}
</style>

<body>

<div id="app">
<!-- HEADER, LEFT, SPACE, RIGHT, FOOTER, TOAST, MODAL – exakt wie bei dir (keine Änderung nötig) -->
<!-- (der gesamte HTML-Body ist identisch mit deiner Datei – ich habe nur den Script-Teil unten eingefügt) -->

<script type="module">
/* ==================== IMPORTS & CONFIG ==================== */
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";

env.allowRemoteModels = true;
env.allowLocalModels = true;

const DB_NAME = "NEURAL_MEMORY_DB";
const DB_VERSION = 2;
const STORE_NAME = "memoryObjects";
const VECTOR_DIM = 384;
const MODEL_NAME = "Xenova/multilingual-e5-small";

/* ==================== STATE ==================== */
const state = {
  objects: [],
  selectedId: null,
  activeFilter: "all",
  searchText: "",
  searchResults: null,
  embeddingsPipeline: null,
  modelLoading: false,
  modelReady: false,
  db: null,
  dbPromise: null,
  scene: null,
  camera: null,
  renderer: null,
  controls: null,
  raycaster: new THREE.Raycaster(),
  mouse: new THREE.Vector2(),
  nodeMeshes: new Map(),
  nodeLabels: new Map(),
  relationLines: [],
  projected: new Map(),
  relationSourceId: null
};

/* ==================== DOM ==================== */
const $ = id => document.getElementById(id);

/* ==================== UI HELPERS ==================== */
function setLog(text, error = false) {
  $("log").textContent = text;
  $("statusDot").classList.toggle("error", error);
}
function setEngineStatus(text, error = false) {
  $("engineStatus").textContent = text;
  $("statusDot").classList.toggle("error", error);
}
let toastTimer = null;
function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ==================== ID & DATE ==================== */
function createId() {
  const time = Date.now().toString(36).toUpperCase();
  const random = Math.random().toString(36).slice(2,8).toUpperCase();
  return `MEM-${time}-${random}`;
}
function nowISO() { return new Date().toISOString(); }

/* ==================== VECTOR MATH ==================== */
function vectorNorm(v) {
  let sum = 0;
  for (const x of v) sum += x * x;
  return Math.sqrt(sum);
}
function normalizeVector(v) {
  const n = vectorNorm(v);
  if (!n) return v.slice();
  return v.map(x => x / n);
}
function dot(a, b) {
  let sum = 0;
  const n = Math.min(a.length, b.length);
  for (let i = 0; i < n; i++) sum += a[i] * b[i];
  return sum;
}
function cosineSimilarity(a, b) {
  if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return 0;
  const na = vectorNorm(a), nb = vectorNorm(b);
  if (na === 0 || nb === 0) return 0;
  return dot(a, b) / (na * nb);
}

/* ==================== EMBEDDING ==================== */
async function getEmbeddingPipeline() {
  if (state.embeddingsPipeline) return state.embeddingsPipeline;
  if (state.modelLoading) {
    while (state.modelLoading) await new Promise(r => setTimeout(r, 100));
    if (state.embeddingsPipeline) return state.embeddingsPipeline;
  }
  state.modelLoading = true;
  setEngineStatus("LOADING VECTOR MODEL...");
  setLog("LOADING MODEL...");
  try {
    state.embeddingsPipeline = await pipeline(MODEL_NAME);
    state.modelReady = true;
    setEngineStatus("LOCAL MEMORY ONLINE");
    setLog("VECTOR MODEL READY");
    return state.embeddingsPipeline;
  } catch (e) {
    console.error(e);
    state.modelReady = false;
    setEngineStatus("VECTOR MODEL ERROR", true);
    setLog("MODEL ERROR", true);
    throw e;
  } finally {
    state.modelLoading = false;
  }
}
async function createEmbedding(text) {
  if (!text || !text.trim()) throw new Error("Embedding text is empty.");
  const extractor = await getEmbeddingPipeline();
  const result = await extractor(text.trim(), { pooling: "mean", normalize: true });
  let values = result && result.data ? Array.from(result.data) : Array.isArray(result) ? Array.from(result) : [];
  if (values.length !== VECTOR_DIM) throw new Error(`Expected ${VECTOR_DIM} dimensions, got ${values.length}.`);
  return normalizeVector(values);
}

/* ==================== DATABASE ==================== */
function openDB() {
  if (state.db) return Promise.resolve(state.db);
  if (state.dbPromise) return state.dbPromise;
  state.dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: "id" });
    };
    req.onsuccess = e => {
      state.db = e.target.result;
      state.db.onclose = () => { state.db = null; state.dbPromise = null; };
      resolve(state.db);
    };
    req.onerror = () => { state.dbPromise = null; reject(req.error || new Error("IndexedDB open failed.")); };
  });
  return state.dbPromise;
}
async function loadDatabase() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function saveObject(o) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).put(o);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function saveAll(objects) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);
    objects.forEach(o => store.put(o));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function deleteAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ==================== VALIDATION & NORMALIZE ==================== */
function validEmbedding(v) {
  return Array.isArray(v) && v.length === VECTOR_DIM && v.every(x => typeof x === "number" && Number.isFinite(x));
}
function normalizeImportedObject(raw) {
  if (raw && typeof raw === "object" && Array.isArray(raw.embedding)) {
    if (!validEmbedding(raw.embedding)) throw new Error(`Invalid embedding for ${raw.id || "object"}.`);
    const created = raw.createdAt || raw.created || nowISO();
    return { id: raw.id || createId(), version: 2, type: raw.type || "concept", label: raw.label || raw.name || "Unnamed", description: raw.description || "", tags: Array.isArray(raw.tags) ? raw.tags : [], relations: Array.isArray(raw.relations) ? raw.relations : [], embedding: normalizeVector(raw.embedding), provenance: raw.provenance || { source: "import" }, createdAt: created, updatedAt: raw.updatedAt || created };
  }
  if (raw && typeof raw === "object" && Array.isArray(raw.vector)) {
    if (!validEmbedding(raw.vector)) throw new Error(`Invalid legacy vector for ${raw.id || "object"}.`);
    const text = raw.text || raw.label || raw.description || "Migrated memory";
    const created = raw.created || nowISO();
    return { id: raw.id || createId(), version: 2, type: "concept", label: raw.label || text, description: raw.description || text, tags: [], relations: [], embedding: normalizeVector(raw.vector), provenance: { source: "migration", method: "legacy_neural_memory" }, createdAt: created, updatedAt: nowISO() };
  }
  throw new Error("Unsupported memory object format.");
}

/* ==================== CREATE OBJECT ==================== */
async function createMemoryObject() {
  const label = $("name").value.trim();
  const type = $("type").value;
  const description = $("description").value.trim();
  const tags = $("tags").value.split(",").map(t => t.trim()).filter(Boolean);

  if (!label) { toast("NAME FEHLT"); $("name").focus(); return; }
  if (!description) { toast("BESCHREIBUNG FEHLT"); $("description").focus(); return; }

  const btn = $("createBtn");
  btn.disabled = true;
  setLog("CREATING EMBEDDING...");

  let embedding;
  try {
    embedding = await createEmbedding([label, description, tags.join(", ")].filter(Boolean).join(". "));
  } catch (e) {
    console.error(e);
    setLog("EMBEDDING ERROR", true);
    toast("384D-Embedding konnte nicht erzeugt werden.");
    btn.disabled = false;
    return;
  }

  const object = {
    id: createId(), version: 2, type, label, description, tags, relations: [], embedding, provenance: { source: "user", method: "transformers.js", model: MODEL_NAME }, createdAt: nowISO(), updatedAt: nowISO()
  };

  try {
    await saveObject(object);
  } catch (e) {
    console.error(e);
    setLog("DATABASE ERROR", true);
    toast("Embedding erzeugt, aber Speicherung fehlgeschlagen.");
    btn.disabled = false;
    return;
  }

  state.objects.push(object);
  state.selectedId = object.id;
  $("name").value = ""; $("description").value = ""; $("tags").value = "";
  btn.disabled = false;

  setLog("MEMORY OBJECT STORED");
  toast("MEMORY OBJECT STORED");
  updateUI();
}

/* ==================== RELATIONS (jetzt vollständig) ==================== */
function relationCount() {
  return state.objects.reduce((sum, o) => sum + (Array.isArray(o.relations) ? o.relations.length : 0), 0);
}
function getObject(id) { return state.objects.find(o => o.id === id); }

function openRelationModal() {
  const source = getObject(state.selectedId);
  if (!source) { toast("ZUERST EIN OBJECT AUSWÄHLEN"); return; }
  state.relationSourceId = source.id;
  $("relationSource").textContent = `${source.label} (${source.id})`;
  $("relationType").value = "";

  const select = $("relationTarget");
  select.innerHTML = "";
  for (const o of state.objects) {
    if (o.id === source.id) continue;
    const opt = document.createElement("option");
    opt.value = o.id;
    opt.textContent = `${o.label} — ${o.id}`;
    select.appendChild(opt);
  }
  if (!select.options.length) { toast("Mindestens zwei Objects benötigt."); return; }
  $("relationModal").classList.add("show");
}
function closeRelationModal() {
  $("relationModal").classList.remove("show");
  state.relationSourceId = null;
}
async function createRelation() {
  const source = getObject(state.relationSourceId);
  const target = getObject($("relationTarget").value);
  const type = $("relationType").value.trim();
  if (!source || !target || !type) return;

  if (!Array.isArray(source.relations)) source.relations = [];

  const exists = source.relations.some(r => r.target === target.id && r.type === type);
  if (exists) { toast("RELATION EXISTIERT BEREITS"); return; }

  source.relations.push({ type, target: target.id });
  source.updatedAt = nowISO();

  try {
    await saveObject(source);
  } catch (e) {
    console.error(e);
    toast("RELATION KONNTE NICHT GESPEICHERT WERDEN");
    return;
  }
  closeRelationModal();
  toast("RELATION CREATED");
  setLog("GRAPH UPDATED");
  updateUI();
}

/* ==================== SEARCH ==================== */
let searchTimer = null;
async function semanticSearch(query) {
  if (!query.trim()) {
    state.searchResults = null;
    renderExplorer();
    return;
  }
  if (!state.objects.length) {
    state.searchResults = [];
    renderExplorer();
    return;
  }

  setLog("SEMANTIC SEARCH...");
  try {
    const queryVector = await createEmbedding(query);
    const results = state.objects.map(o => ({ object: o, score: cosineSimilarity(queryVector, o.embedding) })).sort((a, b) => b.score - a.score);
    state.searchResults = results;
    setLog("SEMANTIC SEARCH READY");
    renderExplorer();
  } catch (e) {
    console.error(e);
    state.searchResults = null;
    setLog("SEARCH ERROR", true);
  }
}

/* ==================== FILTER & RENDER ==================== */
function matchesFilter(o) {
  if (state.activeFilter === "all") return true;
  return o.type === state.activeFilter;
}
function renderExplorer() {
  const list = $("objectList");
  list.innerHTML = "";
  let results = (state.searchResults !== null)
    ? state.searchResults.filter(r => matchesFilter(r.object))
    : state.objects.filter(matchesFilter).map(o => ({ object: o, score: null }));

  if (!results.length) {
    const empty = document.createElement("div");
    empty.className = "inspector-empty";
    empty.textContent = state.objects.length ? "Keine passenden Memory Objects." : "Noch keine Memory Objects vorhanden.";
    list.appendChild(empty);
    return;
  }

  for (const result of results) {
    const object = result.object;
    const item = document.createElement("div");
    item.className = "object";
    if (object.id === state.selectedId) item.classList.add("selected");

    const scoreHTML = result.score === null ? "" : `<span style="color:#4ade80;font-size:7px;margin-left:5px">${(result.score*100).toFixed(1)}%</span>`;

    item.innerHTML = `
      <div class="object-head">
        <div class="object-name">${escapeHTML(object.label)}${scoreHTML}</div>
        <div class="object-type">${escapeHTML(object.type.toUpperCase())}</div>
      </div>
      <div class="object-desc">${escapeHTML(object.description)}</div>
    `;
    item.addEventListener("click", () => selectObject(object.id));
    list.appendChild(item);
  }
}
function renderInspector() {
  const inspector = $("inspector");
  const object = getObject(state.selectedId);
  if (!object) {
    inspector.innerHTML = `<div class="inspector-empty">Noch keine Memory Objects vorhanden.<br><br>Lege links dein erstes Objekt an.</div>`;
    return;
  }

  const tags = Array.isArray(object.tags) ? object.tags : [];
  const relations = Array.isArray(object.relations) ? object.relations : [];

  let relationHTML = relations.length
    ? relations.map(r => {
        const target = getObject(r.target);
        return `<div class="relation"><span class="relation-type">${escapeHTML(r.type)}</span><span class="relation-target">${escapeHTML(target ? target.label : r.target)}</span></div>`;
      }).join("")
    : `<div class="small-note">Keine Relations vorhanden.</div>`;

  const tagHTML = tags.length
    ? tags.map(t => `<span class="tag">${escapeHTML(t)}</span>`).join("")
    : `<span class="small-note">Keine Tags</span>`;

  inspector.innerHTML = `
    <div class="inspector-name">${escapeHTML(object.label)}</div>
    <div class="inspector-id">${escapeHTML(object.id)}</div>
    <div class="meta">
      <div class="meta-item"><div class="meta-key">TYPE</div><div class="meta-value">${escapeHTML(object.type)}</div></div>
      <div class="meta-item"><div class="meta-key">VERSION</div><div class="meta-value">${object.version}</div></div>
      <div class="meta-item"><div class="meta-key">VECTOR</div><div class="meta-value">${object.embedding.length}D</div></div>
      <div class="meta-item"><div class="meta-key">SOURCE</div><div class="meta-value">${escapeHTML(object.provenance?.source || "unknown")}</div></div>
    </div>
    <div class="inspector-description">${escapeHTML(object.description)}</div>
    <div class="tag-list">${tagHTML}</div>
    <div class="relations">
      <div class="panel-title">RELATIONS</div>
      ${relationHTML}
    </div>
    <div class="inspector-actions">
      <button class="secondary" id="addRelationBtn">+ RELATION</button>
      <button class="secondary danger" id="deleteObjectBtn">DELETE</button>
    </div>
    <div class="small-note">CREATED: ${escapeHTML(object.createdAt)}<br>UPDATED: ${escapeHTML(object.updatedAt)}</div>
  `;

  $("addRelationBtn")?.addEventListener("click", openRelationModal);
  $("deleteObjectBtn")?.addEventListener("click", async () => {
    if (confirm(`Memory Object "${object.label}" wirklich löschen?`)) {
      await deleteObject(object.id);
    }
  });
}

/* ==================== SELECT & SCENE ==================== */
function selectObject(id) {
  state.selectedId = id;
  renderExplorer();
  renderInspector();
  updateSceneSelection();
}

function colorForType(type) {
  switch (type) {
    case "concept": return 0x00f5ff;
    case "system": return 0x4ade80;
    case "project": return 0xff2bd6;
    case "technology": return 0xffe600;
    case "person": return 0xff8a00;
    default: return 0x9aa8b8;
  }
}

/* ==================== PROJECT VECTORS (verbessert) ==================== */
function projectVectors(objects) {
  const result = new Map();
  if (!objects.length) return result;
  if (objects.length === 1) {
    result.set(objects[0].id, new THREE.Vector3(0, 0, 0));
    return result;
  }

  const dimension = VECTOR_DIM;
  const matrix = objects.map(o => o.embedding.slice());
  const mean = new Array(dimension).fill(0);
  for (const vector of matrix) for (let d = 0; d < dimension; d++) mean[d] += vector[d];
  for (let d = 0; d < dimension; d++) mean[d] /= matrix.length;

  const centered = matrix.map(vector => vector.map((value, i) => value - mean[i]));

  function covarianceMultiply(v) {
    const output = new Array(dimension).fill(0);
    for (const row of centered) {
      let projection = 0;
      for (let d = 0; d < dimension; d++) projection += row[d] * v[d];
      for (let d = 0; d < dimension; d++) output[d] += row[d] * projection;
    }
    return output;
  }

  function normalizeSafe(v) {
    const norm = vectorNorm(v);
    if (norm < 1e-12) return null;
    return v.map(x => x / norm);
  }

  function orthogonalize(v, prev) {
    let res = v.slice();
    for (const axis of prev) {
      const proj = dot(res, axis);
      for (let d = 0; d < dimension; d++) res[d] -= proj * axis[d];
    }
    return normalizeSafe(res);
  }

  function initialVector(seed) {
    const v = new Array(dimension);
    for (let d = 0; d < dimension; d++) v[d] = Math.sin((d + 1) * (seed + 1) * 12.9898);
    return normalizeSafe(v);
  }

  function findAxis(prev, seed) {
    let v = orthogonalize(initialVector(seed), prev);
    if (!v) return null;
    for (let i = 0; i < 40; i++) {
      let next = covarianceMultiply(v);
      next = orthogonalize(next, prev);
      if (!next) return null;
      v = next;
    }
    return v;
  }

  const axes = [];
  for (let i = 0; i < 3; i++) {
    const a = findAxis(axes, i);
    if (a) axes.push(a);
  }
  while (axes.length < 3) {
    const fallback = new Array(dimension).fill(0);
    fallback[axes.length] = 1;
    const a = orthogonalize(fallback, axes);
    if (a) axes.push(a);
  }

  const projected = centered.map(vector => {
    const vals = [];
    for (const axis of axes) vals.push(dot(vector, axis));
    while (vals.length < 3) vals.push(0);
    return vals;
  });

  let maxAbs = 0;
  for (const p of projected) for (const v of p) maxAbs = Math.max(maxAbs, Math.abs(v));
  if (maxAbs < 1e-9) maxAbs = 1;

  for (let i = 0; i < objects.length; i++) {
    const p = projected[i];
    result.set(objects[i].id, new THREE.Vector3((p[0] / maxAbs) * 5, (p[1] / maxAbs) * 5, (p[2] / maxAbs) * 5));
  }
  return result;
}

/* ==================== 3D SCENE (mit Touch-Pinch) ==================== */
function initScene() {
  const container = $("scene");
  state.scene = new THREE.Scene();
  state.camera = new THREE.PerspectiveCamera(55, container.clientWidth / Math.max(1, container.clientHeight), 0.1, 1000);
  state.camera.position.set(0, 0, 13);

  state.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
  state.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  state.renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(state.renderer.domElement);

  state.controls = createOrbitControls(state.camera, state.renderer.domElement);

  const grid = new THREE.GridHelper(14, 14, 0x12313a, 0x09131c);
  grid.rotation.x = Math.PI / 2;
  grid.position.z = -3.5;
  grid.material.transparent = true;
  grid.material.opacity = 0.22;
  state.scene.add(grid);

  const axes = new THREE.AxesHelper(4);
  axes.material.transparent = true;
  axes.material.opacity = 0.25;
  state.scene.add(axes);

  const center = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), new THREE.MeshBasicMaterial({ color: 0x00f5ff }));
  state.scene.add(center);

  state.renderer.domElement.addEventListener("pointerup", onPointerUp);
  window.addEventListener("resize", resizeScene);
  animate();
}

/* ==================== CUSTOM ORBIT CONTROLS (Desktop + Touch-Pinch) ==================== */
function createOrbitControls(camera, element) {
  const controls = { target: new THREE.Vector3(), distance: 13, theta: Math.PI / 2, phi: 0, dragging: false, lastX: 0, lastY: 0, touchDistance: null, damping: 0.12, rotateSpeed: 0.006, zoomSpeed: 0.0015 };

  element.style.touchAction = "none";

  function updateCamera() {
    const sinTheta = Math.sin(controls.theta);
    camera.position.set(controls.distance * sinTheta * Math.cos(controls.phi), controls.distance * Math.cos(controls.theta), controls.distance * sinTheta * Math.sin(controls.phi));
    camera.lookAt(controls.target);
  }

  element.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    controls.dragging = true;
    controls.lastX = e.clientX;
    controls.lastY = e.clientY;
    element.setPointerCapture?.(e.pointerId);
  });

  element.addEventListener("pointermove", e => {
    if (!controls.dragging) return;
    const dx = e.clientX - controls.lastX;
    const dy = e.clientY - controls.lastY;
    controls.lastX = e.clientX;
    controls.lastY = e.clientY;
    controls.phi -= dx * controls.rotateSpeed;
    controls.theta -= dy * controls.rotateSpeed;
    const limit = 0.05;
    controls.theta = Math.max(limit, Math.min(Math.PI - limit, controls.theta));
    updateCamera();
  });

  element.addEventListener("pointerup", () => { controls.dragging = false; element.releasePointerCapture?.(); });
  element.addEventListener("pointercancel", () => controls.dragging = false);

  element.addEventListener("wheel", e => {
    e.preventDefault();
    controls.distance *= Math.exp(e.deltaY * controls.zoomSpeed);
    controls.distance = Math.max(3, Math.min(40, controls.distance));
    updateCamera();
  }, { passive: false });

  element.addEventListener("touchstart", e => {
    if (e.touches.length === 2) controls.touchDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }, { passive: true });

  element.addEventListener("touchmove", e => {
    if (e.touches.length !== 2 || controls.touchDistance === null) return;
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const delta = controls.touchDistance - dist;
    controls.distance *= 1 + delta * 0.005;
    controls.distance = Math.max(3, Math.min(40, controls.distance));
    controls.touchDistance = dist;
    updateCamera();
  }, { passive: true });

  element.addEventListener("touchend", () => controls.touchDistance = null);

  updateCamera();
  return controls;
}

function onPointerUp(event) {
  if (!state.renderer) return;
  const rect = state.renderer.domElement.getBoundingClientRect();
  state.mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  state.mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  state.raycaster.setFromCamera(state.mouse, state.camera);
  const hits = state.raycaster.intersectObjects(Array.from(state.nodeMeshes.values()));
  if (hits.length) selectObject(hits[0].object.userData.objectId);
}

function makeTextSprite(text) {
  const canvas = document.createElement("canvas");
  canvas.width = 512; canvas.height = 64;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = "700 24px Arial";
  ctx.fillStyle = "rgba(230,247,255,.9)";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(2.2, 0.28, 1);
  return sprite;
}

function rebuildScene() {
  if (!state.scene) return;
  for (const mesh of state.nodeMeshes.values()) { state.scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); }
  state.nodeMeshes.clear();
  for (const sprite of state.nodeLabels.values()) { state.scene.remove(sprite); if (sprite.material.map) sprite.material.map.dispose(); sprite.material.dispose(); }
  state.nodeLabels.clear();
  for (const line of state.relationLines) { state.scene.remove(line); line.geometry.dispose(); line.material.dispose(); }
  state.relationLines = [];

  state.projected = projectVectors(state.objects);

  for (const object of state.objects) {
    const position = state.projected.get(object.id);
    if (!position) continue;
    const selected = object.id === state.selectedId;
    const geometry = new THREE.SphereGeometry(selected ? 0.25 : 0.17, 20, 20);
    const material = new THREE.MeshBasicMaterial({ color: colorForType(object.type) });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.copy(position);
    mesh.userData.objectId = object.id;
    state.scene.add(mesh);
    state.nodeMeshes.set(object.id, mesh);

    const label = makeTextSprite(object.label);
    label.position.copy(position);
    label.position.y += 0.32;
    state.scene.add(label);
    state.nodeLabels.set(object.id, label);
  }

  for (const source of state.objects) {
    const sourcePos = state.projected.get(source.id);
    if (!sourcePos) continue;
    for (const relation of source.relations || []) {
      const targetPos = state.projected.get(relation.target);
      if (!targetPos) continue;
      const geometry = new THREE.BufferGeometry().setFromPoints([sourcePos, targetPos]);
      const material = new THREE.LineBasicMaterial({ color: 0xff2bd6, transparent: true, opacity: 0.42 });
      const line = new THREE.Line(geometry, material);
      state.scene.add(line);
      state.relationLines.push(line);
    }
  }
}

function updateSceneSelection() {
  for (const [id, mesh] of state.nodeMeshes) {
    mesh.scale.setScalar(id === state.selectedId ? 1.6 : 1);
  }
}

function resizeScene() {
  const container = $("scene");
  if (!state.camera || !state.renderer) return;
  const w = Math.max(1, container.clientWidth);
  const h = Math.max(1, container.clientHeight);
  state.camera.aspect = w / h;
  state.camera.updateProjectionMatrix();
  state.renderer.setSize(w, h);
}

function animate() {
  requestAnimationFrame(animate);
  if (state.renderer) state.renderer.render(state.scene, state.camera);
}

/* ==================== UI ==================== */
function updateUI() {
  $("objectCount").textContent = state.objects.length;
  $("relationCount").textContent = relationCount();
  $("spaceInfo").textContent = `${state.objects.length} MEMORY OBJECTS · 384D → 3D`;
  renderExplorer();
  renderInspector();
  rebuildScene();
  updateSceneSelection();
}

/* ==================== EXPORT / IMPORT / CLEAR / DEMO ==================== */
function exportMemory() {
  const payload = { format: "NEURAL_MEMORY", version: 2, dimension: VECTOR_DIM, model: MODEL_NAME, exportedAt: nowISO(), objects: state.objects };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "neural-memory-export.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setLog("MEMORY EXPORTED");
  toast("MEMORY JSON EXPORTED");
}
async function importMemoryFile(file) {
  const text = await file.text();
  let parsed;
  try { parsed = JSON.parse(text); } catch (e) { throw new Error("JSON konnte nicht gelesen werden."); }
  let rawObjects = Array.isArray(parsed) ? parsed : Array.isArray(parsed.objects) ? parsed.objects : Array.isArray(parsed.memory) ? parsed.memory : [];
  const normalized = [];
  for (const raw of rawObjects) normalized.push(normalizeImportedObject(raw));
  await saveAll(normalized);
  const map = new Map(state.objects.map(o => [o.id, o]));
  for (const o of normalized) map.set(o.id, o);
  state.objects = Array.from(map.values());
  if (normalized.length && !state.selectedId) state.selectedId = normalized[0].id;
  updateUI();
  setLog(`${normalized.length} OBJECTS IMPORTED`);
  toast(`${normalized.length} Memory Objects importiert`);
}
async function clearDatabase() {
  if (!state.objects.length) { toast("DATABASE IST BEREITS LEER"); return; }
  if (!confirm("Alle Memory Objects und Relations löschen?")) return;
  await deleteAll();
  state.objects = []; state.selectedId = null; state.searchResults = null;
  updateUI();
  setLog("DATABASE CLEARED");
  toast("DATABASE CLEARED");
}
async function createOptionalDemo() {
  if (state.objects.length) { toast("DATABASE IST NICHT LEER"); return; }
  const demo = [
    { label: "AETHER", type: "system", description: "System zur Trennung von LLM-Planung und deterministischer Ausführung.", tags: ["llm", "architecture", "execution"] },
    { label: "EOTS", type: "project", description: "Visuelle Schnittstelle zwischen Benutzer, visueller Umgebung und LLM.", tags: ["vision", "llm", "ui"] },
    { label: "Semantic Memory", type: "concept", description: "Strukturierter Speicher aus Objekten, Relationen und semantischen Vektorrepräsentationen.", tags: ["memory", "embedding", "rag"] },
    { label: "Transformers.js", type: "technology", description: "JavaScript Bibliothek zur lokalen Ausführung von Machine-Learning-Modellen im Browser.", tags: ["javascript", "embedding", "local"] }
  ];
  setLog("BUILDING OPTIONAL DEMO...");
  for (const item of demo) {
    const embedding = await createEmbedding([item.label, item.description, item.tags.join(", ")].join(". "));
    state.objects.push({ id: createId(), version: 2, type: item.type, label: item.label, description: item.description, tags: item.tags, relations: [], embedding, provenance: { source: "demo", method: "transformers.js", model: MODEL_NAME }, createdAt: nowISO(), updatedAt: nowISO() });
  }
  const aether = state.objects.find(x => x.label === "AETHER");
  const eots = state.objects.find(x => x.label === "EOTS");
  const memory = state.objects.find(x => x.label === "Semantic Memory");
  const transformers = state.objects.find(x => x.label === "Transformers.js");
  if (aether && memory) aether.relations.push({ type: "uses", target: memory.id });
  if (eots && memory) eots.relations.push({ type: "uses", target: memory.id });
  if (memory && transformers) memory.relations.push({ type: "uses", target: transformers.id });
  await saveAll(state.objects);
  state.selectedId = aether?.id || state.objects[0]?.id || null;
  updateUI();
  setLog("OPTIONAL DEMO READY");
  toast("OPTIONALE DEMO ERZEUGT");
}

/* ==================== INITIALIZE ==================== */
async function initialize() {
  setLog("INITIALIZING...");
  try {
    await openDB();
    const stored = await loadDatabase();
    const normalized = [];
    let migrated = false;
    for (const raw of stored) {
      try {
        const obj = normalizeImportedObject(raw);
        normalized.push(obj);
        if (raw.version !== 2 || raw.vector) migrated = true;
      } catch (e) {
        console.warn("Invalid object skipped:", raw, e);
      }
    }
    if (migrated) {
      await saveAll(normalized);
      setLog("LEGACY MEMORY MIGRATED");
    }
    state.objects = normalized;
    if (state.objects.length) state.selectedId = state.objects[0].id;
    setEngineStatus("LOCAL MEMORY ONLINE");
    updateUI();
    setLog("READY");
  } catch (e) {
    console.error(e);
    setEngineStatus("STORAGE ERROR", true);
    setLog("DATABASE ERROR", true);
    toast("Persistent Storage konnte nicht initialisiert werden.");
  }
}

/* ==================== EVENTS ==================== */
$("createBtn").addEventListener("click", createMemoryObject);
$("exportBtn").addEventListener("click", exportMemory);
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", async e => {
  const file = e.target.files?.[0];
  if (!file) return;
  try { await importMemoryFile(file); } catch (err) {
    console.error(err);
    setLog("IMPORT ERROR", true);
    toast(err.message || "Import fehlgeschlagen.");
  }
  e.target.value = "";
});
$("clearBtn").addEventListener("click", clearDatabase);
$("demoBtn").addEventListener("click", createOptionalDemo);

$("search").addEventListener("input", e => {
  state.searchText = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => semanticSearch(state.searchText), 350);
});

document.querySelectorAll(".filter").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter").forEach(i => i.classList.remove("active"));
    btn.classList.add("active");
    state.activeFilter = btn.dataset.filter;
    renderExplorer();
  });
});

/* Relation Modal Events */
$("closeRelation").addEventListener("click", closeRelationModal);
$("cancelRelation").addEventListener("click", closeRelationModal);
$("saveRelation").addEventListener("click", createRelation);
$("relationModal").addEventListener("click", e => { if (e.target === $("relationModal")) closeRelationModal(); });

/* Keyboard */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeRelationModal();
  if (e.key === "/" && document.activeElement?.tagName !== "INPUT" && document.activeElement?.tagName !== "TEXTAREA") {
    e.preventDefault();
    $("search").focus();
  }
});

/* ==================== START ==================== */
initScene();
initialize();
</script>
